<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b1530" />
    <title>Bible Quest</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1b1530;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      /* Read by services/safeArea.ts to expose notch/home-indicator insets to the game. */
      #safe-area-probe {
        position: fixed;
        visibility: hidden;
        pointer-events: none;
        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="safe-area-probe"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
